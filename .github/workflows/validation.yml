name: Validate application variants
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm run format:check
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build
      - run: npm run build:site
  android:
    needs: frontend
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [download, tls, notls]
    env:
      NDK_VERSION: 27.2.12479018
      ABI: arm64-v8a
      ANDROID_PLATFORM: android-29
      XMRIG_REF: v6.26.0
      LIBUV_REF: v1.48.0
      OPENSSL_REF: openssl-4.0.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: bun install --frozen-lockfile
      - run: npm run android:sync
      - name: Prepare SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build miner
        if: matrix.variant != 'download'
        env:
          WITH_TLS: ${{ matrix.variant == 'tls' && 'ON' || 'OFF' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake make ninja-build perl pkg-config
          bash miner-builder/build-xmrig-android.sh
      - name: Test and build variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          chmod +x android/gradlew
          options=(-PminerVariant="$VARIANT")
          if [ "$VARIANT" = download ]; then
            options+=(-PtargetSdkVersionOverride=28)
          else
            options+=(-PbundleMiner=true)
          fi
          android/gradlew -p android testDebugUnitTest lintDebug assembleDebug "${options[@]}" --stacktrace
  miner-armeabi-v7a:
    needs: frontend
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.2.12479018
      ABI: armeabi-v7a
      WITH_TLS: 'ON'
      SKIP_INSTALL: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Prepare toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake make ninja-build perl pkg-config qemu-user gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build armeabi-v7a miner (API 24)
        run: bash miner-builder/build-xmrig-android.sh
      - name: Emulated RandomX hash check (qemu-user, not the Android binary)
        run: bash miner-builder/validate-armv7-qemu.sh
      - uses: actions/upload-artifact@v7
        with:
          name: androminer-armeabi-v7a-miner
          path: miner-builder/work/build/xmrig-armeabi-v7a/libxmrig.so
