name: Android Miner Binary

on:
  push:
    branches: [main]
    paths:
      - miner-builder/**
      - .github/workflows/binary-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build and publish ARM miner binaries
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      NDK_VERSION: 27.2.12479018
      ABI: arm64-v8a
      ANDROID_PLATFORM: android-29
      XMRIG_REF: v6.26.0
      LIBUV_REF: v1.48.0
      OPENSSL_REF: openssl-4.0.0

    steps:
      - name: Check out main branch
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake make ninja-build perl pkg-config

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # yes can receive SIGPIPE after sdkmanager has read the final answer.
          (yes || true) | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build TLS miner
        env:
          WITH_TLS: 'ON'
          QUIET: 'ON'
        run: bash miner-builder/build-xmrig-android.sh

      - name: Collect TLS miner
        run: |
          mkdir -p miner-payload/lib/arm64-v8a/tls
          cp android/app/src/main/jniLibs/arm64-v8a/libxmrig.so miner-payload/lib/arm64-v8a/tls/libxmrig.so

      - name: Build no-TLS miner
        env:
          WITH_TLS: 'OFF'
          QUIET: 'ON'
        run: bash miner-builder/build-xmrig-android.sh

      - name: Collect no-TLS miner
        run: |
          mkdir -p miner-payload/lib/arm64-v8a/notls
          cp android/app/src/main/jniLibs/arm64-v8a/libxmrig.so miner-payload/lib/arm64-v8a/notls/libxmrig.so

      - name: Build ARMv7 TLS miner
        env:
          ABI: armeabi-v7a
          ANDROID_PLATFORM: android-24
          WITH_TLS: 'ON'
          QUIET: 'ON'
        run: bash miner-builder/build-xmrig-android.sh

      - name: Collect ARMv7 TLS miner
        run: |
          mkdir -p miner-payload/lib/armeabi-v7a/tls
          cp android/app/src/main/jniLibs/armeabi-v7a/libxmrig.so miner-payload/lib/armeabi-v7a/tls/libxmrig.so

      - name: Build ARMv7 no-TLS miner
        env:
          ABI: armeabi-v7a
          ANDROID_PLATFORM: android-24
          WITH_TLS: 'OFF'
          QUIET: 'ON'
        run: bash miner-builder/build-xmrig-android.sh

      - name: Collect ARMv7 no-TLS miner
        run: |
          mkdir -p miner-payload/lib/armeabi-v7a/notls
          cp android/app/src/main/jniLibs/armeabi-v7a/libxmrig.so miner-payload/lib/armeabi-v7a/notls/libxmrig.so

      - name: Prepare branch payload
        run: |
          cp miner-payload/lib/arm64-v8a/tls/libxmrig.so miner-payload/lib/arm64-v8a/libxmrig.so
          cp miner-payload/lib/armeabi-v7a/tls/libxmrig.so miner-payload/lib/armeabi-v7a/libxmrig.so
          (cd miner-payload && sha256sum lib/*/libxmrig.so lib/*/tls/libxmrig.so lib/*/notls/libxmrig.so > SHA256SUMS)
          cat > miner-payload/README.md <<'EOF'
          # AndroMiner Miner Binaries

          This branch is generated by the Android Miner Binary workflow on `main`.

          The app can download either binary:

          ```text
          lib/arm64-v8a/tls/libxmrig.so
          lib/arm64-v8a/notls/libxmrig.so
          lib/armeabi-v7a/tls/libxmrig.so
          lib/armeabi-v7a/notls/libxmrig.so
          ```

          `lib/<abi>/libxmrig.so` is kept as the TLS default for compatibility.

          Source and build scripts live in the `miner-builder/` directory on the `main` branch.
          EOF

      - name: Upload miner artifact
        uses: actions/upload-artifact@v7
        with:
          name: androminer-arm-miners
          path: miner-payload/**
          if-no-files-found: error

      - name: Publish miner-builder branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd miner-payload
          git init
          git checkout -b miner-builder
          git add .
          git commit -m "Publish Android miner binary"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin miner-builder

      - name: Upload miner build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: androminer-arm-miner-build-logs
          path: |
            miner-builder/work/logs/
            miner-builder/work/build/**/CMakeCache.txt
            miner-builder/work/build/**/CMakeFiles/CMakeConfigureLog.yaml
            miner-builder/work/build/**/build.ninja
          if-no-files-found: warn
